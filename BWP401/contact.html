<section class="page-header text-center">
    <div class="container">
        <h1>تواصل معنا</h1>
        <p>يسعدنا استقبال استفساراتكم وملاحظاتكم</p>
    </div>
</section>
<section class="container py-5">
    <div class="row g-4">
        <div class="col-lg-6">
            <h2>أرسل رسالة</h2>
            <form id="contactForm">
                <div class="mb-3">
                    <label for="name" class="form-label">الاسم الكامل</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="subject" class="form-label">موضوع الرسالة</label>
                    <input type="text" id="subject" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">الرسالة</label>
                    <textarea id="message" class="form-control" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">إرسال الرسالة</button>
                <p id="formMessage" class="mt-3"></p>
            </form>
        </div>
        <div class="col-lg-6">
            <div class="contact-info">
                <h2>معلومات التواصل</h2>
                <p>يمكنكم التواصل معنا من خلال نموذج الرسائل الموجود في هذه الصفحة.</p>
                <div class="map-container mt-4">
                    <img src="https://placehold.co/700x400/E9E4F5/6C4AB6?text=Map"
                         class="img-fluid rounded" alt="خريطة توضيحية">
                </div>
            </div>
        </div>
    </div>
</section>
